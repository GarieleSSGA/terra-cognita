# =========================================================
# Configuración central de Terra Cognita
# Copia este archivo a config.local.yaml y rellena tus datos
# =========================================================

datahub:
  frontend_url: "http://localhost:9002"
  gms_url: "http://localhost:8080"
  token: ""                 # token de acceso API (vacío = sin autenticar)

ollama:
  model: "gemma3:1b"
  base_url: "http://localhost:11434"

gee:
  project_id: "mi-proyecto-gee"   # requerido si usas datos reales
  coleccion: "COPERNICUS/S2_SR_HARMONIZED"
  fuente_default: "sintetico"     # "sintetico" (demo) | "gee" (real)

alertas:
  telegram_token: ""           # token del bot de BotFather
  chat_id: ""
  umbral_ndvi: 0.3            # bajo este valor -> alerta de sequía
  umbral_lluvia_mm: 50        # >= este valor -> alerta de inundación

dashboard:
  host: "localhost"
  puerto: 8501